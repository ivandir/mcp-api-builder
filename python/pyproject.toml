[project]
name = "mcp-api-builder"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "python-dotenv>=1.0.0",
]

[project.scripts]
mcp-api-builder = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
